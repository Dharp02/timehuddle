name: Tag Experiment (fork only)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A) git push a tag on 915d5ed2
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a exp-git 915d5ed283e22f41fe3e4f8c4908eb93ce8d0f90 -m "experiment"
          git push origin refs/tags/exp-git
      - name: B) REST API annotated tag on 915d5ed2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_SHA=$(gh api repos/${{ github.repository }}/git/tags -f tag=exp-api -f message=experiment \
            -f object=915d5ed283e22f41fe3e4f8c4908eb93ce8d0f90 -f type=commit -q .sha)
          echo "tag object $TAG_SHA"
          gh api repos/${{ github.repository }}/git/refs -f ref=refs/tags/exp-api -f sha="$TAG_SHA" -q .ref
