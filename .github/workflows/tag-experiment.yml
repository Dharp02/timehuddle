name: Tag Experiment (fork only)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - name: D) draft Release targeting main itself
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Experiment body" | gh release create exp-draft --repo ${{ github.repository }} --draft \
            --target ${{ github.sha }} --title "Experiment draft" --notes-file -
